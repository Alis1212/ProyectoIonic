<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Tab 1
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-accordion-group>
    <ion-accordion value="first">
      <ion-item slot="header" color="light">
        <ion-label>Primer Acordionn</ion-label>
      </ion-item>
      <div class="ion-padding" slot="content">Primer Contenido</div>
    </ion-accordion>
    <ion-accordion value="second">
      <ion-item slot="header" color="light">
        <ion-label>Segundo Acordion</ion-label>
      </ion-item>
      <div class="ion-padding" slot="content">Segundo Contenido</div>
    </ion-accordion>
    <ion-accordion value="third">
      <ion-item slot="header" color="light">
        <ion-label>Tercer Acordion</ion-label>
      </ion-item>
      <div class="ion-padding" slot="content">Tecer Contenido</div>
    </ion-accordion>
  </ion-accordion-group>
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tab 1</ion-title>
    </ion-toolbar>
  </ion-header>

  <app-explore-container name="Tab 1 page"></app-explore-container>
</ion-content>
